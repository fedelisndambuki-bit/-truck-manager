name: Deploy Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            cd ${{ secrets.PRODUCTION_PATH }}
            # 1. Maintenance Mode
            php artisan down --refresh=15 || true
            
            # 2. Backup Database (Assuming simple mysqldump for illustration)
            # This should be adapted to the actual production DB setup
            mysqldump -u ${{ secrets.DB_USERNAME }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_DATABASE }} | gzip > backups/pre_deploy_$(date +%F_%H-%M-%S).sql.gz || echo "Backup failed, check permissions"

            # 3. Pull latest code
            git pull origin main
            
            # 4. Install production dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # 5. Run Migrations safely
            php artisan migrate --force
            
            # 6. Rebuild Caches
            php artisan optimize
            php artisan view:cache
            php artisan config:cache
            php artisan route:cache
            
            # 7. Restart Queues
            php artisan queue:restart
            
            # 8. Bring Online
            php artisan up

      - name: Production Health Check
        run: curl -f ${{ secrets.PRODUCTION_URL }}/up || exit 1
