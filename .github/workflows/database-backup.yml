name: Database Backup

on:
  schedule:
    - cron: '0 1 * * *' # Every day at 01:00 UTC
  workflow_dispatch:

jobs:
  backup:
    name: Backup Production Database
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Create Backup via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            cd ${{ secrets.PRODUCTION_PATH }}
            mkdir -p backups
            BACKUP_FILE="backups/db_backup_$(date +%F_%H-%M-%S).sql.gz"
            mysqldump -u ${{ secrets.DB_USERNAME }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_DATABASE }} | gzip > $BACKUP_FILE
            
            # Retention: Remove backups older than 30 days
            find backups/ -name "db_backup_*.sql.gz" -mtime +30 -delete
            
            echo "Backup created: $BACKUP_FILE"

      - name: Report Backup Status
        if: failure()
        run: echo "Database backup failed! Check production server and credentials."
