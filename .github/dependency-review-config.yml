# Dependency Review Configuration
# See https://github.com/actions/dependency-review-action for options

fail-on-severity: high
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - PHP-3.01
  - CC0-1.0
warn-on-licenses:
  - GPL-2.0
  - GPL-3.0
  - LGPL-2.1
  - LGPL-3.0
